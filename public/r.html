<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared report · Fernspend</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/app.css"></head>
<body>
<header class="container nav"><a class="logo" href="/" id="lg"><span>Fernspend</span></a><nav class="nav-links"><a href="/signup">Try Fernspend free</a></nav></header>
<main class="container" style="padding-bottom:40px"><div id="view"><p class="muted">Loading report…</p></div></main>
<script src="/assets/common.js"></script>
<script>
const { money, esc, $ } = FS;
$('#lg').insertAdjacentHTML('afterbegin', FS.logo);
const p = new URLSearchParams(location.search);
fetch(`/api/v1/public/reports/${encodeURIComponent(p.get('id') || '')}?sig=${encodeURIComponent(p.get('sig') || '')}`).then(async (res) => {
  const r = await res.json();
  if (!res.ok) return ($('#view').innerHTML = `<div class="card pad"><h2 style="margin-top:0">Report unavailable</h2><p class="muted">${esc(r.message)}</p></div>`);
  const total = r.expenses.reduce((n, e) => n + e.amount_cents, 0);
  $('#view').innerHTML = `<div class="card pad"><div class="muted small">${esc(r.report.org_name)} · shared by ${esc(r.report.created_by_name)}</div>
    <h1 style="margin:6px 0">${esc(r.report.title)}</h1><div class="muted small">${esc(r.report.period_from)} – ${esc(r.report.period_to)} · ${money(total)}</div>
    <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Submitted by</th><th class="num">Amount</th></tr></thead><tbody>
    ${r.expenses.map((e) => `<tr><td>${esc(e.spent_at)}</td><td>${esc(e.merchant)}</td><td>${esc(e.category)}</td><td>${esc(e.submitted_by)}</td><td class="num">${money(e.amount_cents)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
});
</script></body></html>
