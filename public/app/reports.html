<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports · Fernspend</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/app.css"></head>
<body><div class="shell"><aside class="side" id="side"></aside>
<main class="main">
  <div class="page-head"><h1>Reports</h1></div>
  <div class="card pad" style="max-width:820px;margin-bottom:16px" id="newbox"><form id="rf" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
    <div style="flex:2;min-width:200px"><label style="margin-top:0">Title</label><input id="rt" placeholder="November close" required></div>
    <div><label style="margin-top:0">From</label><input id="rfrom" type="date" required></div><div><label style="margin-top:0">To</label><input id="rto" type="date" required></div>
    <button class="btn btn-primary">Create report</button></form><div class="alert" id="rmsg"></div></div>
  <div class="card" style="margin-bottom:22px"><div class="table-wrap"><table><thead><tr><th>Title</th><th>Period</th><th>Created by</th><th>Sharing</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
  <div id="view"></div>
</main></div>
<script src="/assets/common.js"></script>
<script>
const { api, money, esc, $, alertBox, shell } = FS;
let me;
function renderReport(r, el) {
  const total = r.expenses.reduce((n, e) => n + e.amount_cents, 0);
  el.innerHTML = `<div class="card pad"><div class="page-head" style="margin-bottom:8px"><div><h2 style="margin:0">${esc(r.report.title)}</h2>
    <div class="muted small">${esc(r.report.period_from)} – ${esc(r.report.period_to)} · ${r.expenses.length} expenses · ${money(total)}</div></div>
    <button class="btn btn-sm" onclick="window.print()">Print</button></div>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Submitted by</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody>
    ${r.expenses.map((e) => `<tr><td>${esc(e.spent_at)}</td><td>${esc(e.merchant)}</td><td>${esc(e.category)}</td><td>${esc(e.submitted_by)}</td><td><span class="pill ${esc(e.status)}">${esc(e.status)}</span></td><td class="num">${money(e.amount_cents)}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No expenses in this period.</td></tr>'}
    </tbody></table></div></div>`;
}
async function load() {
  const mgr = me.role === 'owner' || me.role === 'admin';
  const r = await api('/reports');
  $('#rows').innerHTML = r.data.map((x) => `<tr><td><a href="#" data-view="${x.id}">${esc(x.title)}</a></td><td>${esc(x.period_from)} – ${esc(x.period_to)}</td><td>${esc(x.created_by)}</td>
    <td>${x.shared ? 'Link enabled' : 'Private'}</td><td>${mgr ? (x.shared ? `<button class="btn btn-sm" data-unshare="${x.id}">Disable link</button>` : `<button class="btn btn-sm" data-share="${x.id}">Share link</button>`) : ''}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">No reports yet.</td></tr>';
}
(async () => {
  me = await shell('reports');
  $('#newbox').style.display = me.role === 'member' ? 'none' : '';
  const d = new Date(); $('#rto').value = d.toISOString().slice(0, 10); d.setDate(1); $('#rfrom').value = d.toISOString().slice(0, 10);
  $('#rf').onsubmit = async (e) => { e.preventDefault(); try { await api('/reports', { method: 'POST', body: { title: $('#rt').value, period_from: $('#rfrom').value, period_to: $('#rto').value } }); $('#rt').value = ''; load(); } catch (err) { alertBox($('#rmsg'), err.message); } };
  $('#rows').onclick = async (e) => {
    const v = e.target.closest('[data-view]'), sh = e.target.closest('[data-share]'), un = e.target.closest('[data-unshare]');
    if (v) { e.preventDefault(); renderReport(await api(`/reports/${v.dataset.view}`), $('#view')); }
    if (sh) { const r = await api(`/reports/${sh.dataset.share}/share`, { method: 'POST' }); prompt('Anyone with this link can view the report:', location.origin + r.url); load(); }
    if (un) { await api(`/reports/${un.dataset.unshare}/share`, { method: 'DELETE' }); load(); }
  };
  load();
})();
</script></body></html>
